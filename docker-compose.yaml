services:
  frontend:
    build:
      context: .
      dockerfile: infra/dockerfiles/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    image: spambreaker-front-${MODE:-dev}:${TAG:-latest}
    container_name: front_${MODE:-dev}
    ports:
      - "${FRONT_EXPORT:-3000}:80"
    restart: unless-stopped

# Если запускаешь всё вместе — подключи к сети бэкенда:
# networks:
#   default:
#     external: true
#     name: net-${MODE:-dev}
