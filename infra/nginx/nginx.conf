server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────
    # В prod за этим nginx должен стоять reverse-proxy (traefik/caddy)
    # с TLS-терминацией. Здесь — минимальный набор.
    add_header X-Frame-Options "SAMEORIGIN"           always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy "strict-origin"        always;

    # ── Static assets — долгий кеш (vite добавляет хеш в имя файла) ──
    location ~* \.(?:js|css|woff2?|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── API proxy к Core API (если фронт и бэк на одном хосте) ───────
    # Раскомментировать и поменять адрес если нужно:
    # location /api/ {
    #     proxy_pass         http://core_service:8080;
    #     proxy_set_header   Host $host;
    #     proxy_set_header   X-Real-IP $remote_addr;
    #     proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }

    # ── SPA fallback — все маршруты идут в index.html ────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}